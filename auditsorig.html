<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PutaiaoTech H&S – Audit Form</title>
<style>
  body { background-color: #0D3B66; color: #FFD700; font-family: Arial, sans-serif; margin:0; padding:0; }
  header { background-color: #104E8B; padding: 20px; text-align: center; border-bottom: 2px solid #FFD700; }
  header h1 { margin:0; }
  .container { max-width:900px; margin:40px auto; padding:30px; background-color:#104E8B; border:2px solid #FFD700; border-radius:12px; }
  label { display:block; margin-top:15px; font-weight:bold; }
  input, textarea, select { width:100%; padding:10px; margin-top:5px; border:none; border-radius:5px; font-size:1em; }
  textarea { resize: vertical; }
  .checkbox-group label { display:block; margin:8px 0; font-weight:normal; }
  button { margin-top:20px; background-color:#FFD700; color:#0D3B66; padding:15px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; width:100%; transition:0.3s; }
  button:hover { background-color:#fff200; }
  .back-link { text-align:center; margin-top:20px; }
  .back-link a { color:#FFD700; text-decoration:none; font-weight:bold; }
  footer { text-align:center; padding:20px; margin-top:40px; border-top:2px solid #FFD700; }
</style>
</head>
<body>

<header>
  <h1>PutaiaoTech Health & Safety – Audit Form</h1>
</header>

<div class="container">

  <form>
    <label for="auditType">Audit Type</label>
    <select id="auditType">
      <option>Daily</option>
      <option>Weekly</option>
      <option>Monthly</option>
      <option>Annual</option>
    </select>

    <label for="siteName">Site / Project Name</label>
    <input type="text" id="siteName" placeholder="Enter site name">

    <label for="auditDate">Date & Time</label>
    <input type="datetime-local" id="auditDate">

    <label for="auditorName">Auditor Name</label>
    <input type="text" id="auditorName" placeholder="Enter your name">

    <label>H&S Checklist (tick items that are compliant)</label>
    <div class="checkbox-group">
      <label><input type="checkbox"> PPE compliance verified</label>
      <label><input type="checkbox"> Emergency exits unobstructed</label>
      <label><input type="checkbox"> Equipment inspected and functional</label>
      <label><input type="checkbox"> Hazardous substances stored safely</label>
      <label><input type="checkbox"> Staff trained on emergency procedures</label>
      <label><input type="checkbox"> Incident reporting procedures followed</label>
      <label><input type="checkbox"> Corrective actions recorded</label>
    </div>

    <label for="incidentDetails">Incident / Accident Details</label>
    <textarea id="incidentDetails" rows="4" placeholder="Describe any incidents, injuries or hazards observed"></textarea>

    <label for="witnesses">Witnesses (if applicable)</label>
    <input type="text" id="witnesses" placeholder="Enter names">

    <label for="correctiveActions">Corrective Actions Taken / Recommended</label>
    <textarea id="correctiveActions" rows="4"></textarea>

    <button type="submit">Submit Audit</button>
  </form>

  <div class="back-link">
    <a href="dashboard.html">← Back to Dashboard</a>
  </div>
</div>

<footer>
  &copy; 2026 PutaiaoTech | Managed & Marketed by Virtual Online Contact Centre
</footer>

</body>
</html>
