<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PutaiaoTech H&S - Emergency Log</title>
<style>
  body { background-color:#0D3B66; color:#FFD700; font-family: Arial, sans-serif; margin:0; padding:0; }
  .container { max-width:900px; margin:50px auto; padding:30px; background-color:#104E8B; border:2px solid #FFD700; border-radius:12px; }
  h1, h2 { text-align:center; color:#FFD700; }
  label { display:block; margin:10px 0 5px; }
  input, textarea, select { width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:none; }
  button { background-color:#FFD700; color:#0D3B66; padding:12px 20px; border:none; font-weight:bold; cursor:pointer; border-radius:5px; transition:0.3s; }
  button:hover { background-color:#fff200; }
  table { width:100%; border-collapse:collapse; margin-top:20px; }
  th, td { border:1px solid #FFD700; padding:8px; text-align:left; }
</style>
</head>
<body>

<div class="container">
  <h1>PutaiaoTech Health & Safety Assist</h1>
  <h2>Emergency Log</h2>

  <!-- Form to fill emergency -->
  <label>Emergency Title / Type</label>
  <input type="text" id="emergencyType" placeholder="e.g., Fire, Chemical Spill">

  <label>Staff on Site</label>
  <textarea id="staffOnSite" placeholder="Enter names, roles"></textarea>

  <label>Actions Taken</label>
  <textarea id="actionsTaken" placeholder="Evacuations, First Aid, Equipment Checks, Notifications"></textarea>

  <label>Time Reported</label>
  <input type="datetime-local" id="timeReported">

  <label>Additional Notes</label>
  <textarea id="notes" placeholder="Any other relevant information"></textarea>

  <button id="saveEntry">Save Entry</button>
  <button id="downloadCSV">Download CSV for Audit</button>

  <h2>Recorded Emergencies</h2>
  <table id="emergencyTable">
    <thead>
      <tr>
        <th>Emergency</th>
        <th>Staff On Site</th>
        <th>Actions Taken</th>
        <th>Time Reported</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  let emergencyLog = JSON.parse(localStorage.getItem('emergencyLog')) || [];
  const tableBody = document.querySelector('#emergencyTable tbody');

  function renderTable() {
    tableBody.innerHTML = '';
    emergencyLog.forEach(entry => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${entry.emergencyType}</td>
        <td>${entry.staffOnSite}</td>
        <td>${entry.actionsTaken}</td>
        <td>${entry.timeReported}</td>
        <td>${entry.notes}</td>
      `;
      tableBody.appendChild(row);
    });
  }

  renderTable();

  document.getElementById('saveEntry').addEventListener('click', () => {
    const emergencyType = document.getElementById('emergencyType').value.trim();
    const staffOnSite = document.getElementById('staffOnSite').value.trim();
    const actionsTaken = document.getElementById('actionsTaken').value.trim();
    const timeReported = document.getElementById('timeReported').value;
    const notes = document.getElementById('notes').value.trim();

    if (!emergencyType || !staffOnSite || !actionsTaken || !timeReported) {
      alert('Please fill all required fields.');
      return;
    }

    emergencyLog.push({ emergencyType, staffOnSite, actionsTaken, timeReported, notes });
    localStorage.setItem('emergencyLog', JSON.stringify(emergencyLog));
    renderTable();
  });

  document.getElementById('downloadCSV').addEventListener('click', () => {
    if (emergencyLog.length === 0) { alert('No entries to export.'); return; }
    let csvContent = 'Emergency,Staff On Site,Actions Taken,Time Reported,Notes\n';
    emergencyLog.forEach(e => {
      csvContent += `"${e.emergencyType}","${e.staffOnSite}","${e.actionsTaken}","${e.timeReported}","${e.notes}"\n`;
    });
    const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'emergency_log.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
</script>

</body>
</html>
