<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOCC Subscription Access</title>

<style>
body {
  background-color: #0D3B66;
  color: #FFD700;
  font-family: Arial, sans-serif;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: 60px auto;
  padding: 30px;
  background-color: #104E8B;
  border: 2px solid #FFD700;
  border-radius: 14px;
  text-align: center;
}

.logo-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 15px;
}

.logo-row img {
  height: 55px;
}

h1 {
  margin-bottom: 10px;
}

.price {
  font-size: 1.7em;
  margin: 25px 0;
  font-weight: bold;
}

.section {
  margin-top: 30px;
  padding: 20px;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
}

button {
  background-color: #FFD700;
  color: #0D3B66;
  padding: 15px 25px;
  border: none;
  font-size: 1em;
  cursor: pointer;
  border-radius: 6px;
  margin-top: 15px;
  font-weight: bold;
}

button:hover {
  background-color: #fff200;
}

.note {
  margin-top: 15px;
  font-size: 0.9em;
}

footer {
  margin-top: 40px;
  font-size: 0.85em;
  opacity: 0.85;
}
</style>

</head>
<body>

<div class="container">

<!-- LOGOS -->
<div class="logo-row">
  <img src="/assets/putaiaotech-logo.png" alt="PutaiaoTech">
</div>

<h1>VOCC Health & Safety Platform</h1>
<p>Virtual Online Contact Centre (VOCC)</p>

<div class="price">
Business Subscription: $39 NZD / month
</div>

body>
</html>
 <!-- STRIPE -->
  <a href="https://buy.stripe.com/YOUR-STRIPE-LINK" target="_blank">
    <button class="pay-btn stripe">
      Subscribe Now (Card / Apple Pay)
    </button>
  </a>

  <!-- PAYPAL -->
  <a href="https://www.paypal.com/paypalme/YOURNAME" target="_blank">
    <button class="pay-btn paypal">
      Pay with PayPal
    </button>
  </a>

  <!-- DIVIDER -->
  <p class="divider">OR</p>

  <!-- INVOICE -->
  <button onclick="toggleInvoiceForm()" class="pay-btn invoice">
    Request Invoice (Business Accounts)
  </button>

  <!-- FORM -->
  <div id="invoiceForm" style="display:none; margin-top:20px; text-align:left;">
    
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="text" id="company" placeholder="Company Name">
    <textarea id="details" placeholder="Number of users or requirements"></textarea>

    <button onclick="sendInvoiceRequest()" class="submit-btn">
      Submit Request
    </button>

  </div>

</div>

<style>
.pay-btn {
  width:100%;
  padding:15px;
  margin:10px 0;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.stripe {
  background:#635BFF;
  color:white;
}

.paypal {
  background:#0070BA;
  color:white;
}

.invoice {
  background:#333;
  color:white;
}

.divider {
  margin: 20px 0;
  color:#888;
}

#invoiceForm input,
#invoiceForm textarea {
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border:1px solid #ccc;
  border-radius:6px;
}

.submit-btn {
  width:100%;
  padding:12px;
  background:black;
  color:white;
  border:none;
  border-radius:6px;
}
</style>

<script>
function toggleInvoiceForm() {
  var form = document.getElementById("invoiceForm");
  form.style.display = (form.style.display === "none") ? "block" : "none";
}

function sendInvoiceRequest() {
  var name = document.getElementById("name").value;
  var email = document.getElementById("email").value;
  var company = document.getElementById("company").value;
  var details = document.getElementById("details").value;

  var subject = "Invoice Request - H-Safety Subscription";
  var body = 
    "Name: " + name + "%0D%0A" +
    "Email: " + email + "%0D%0A" +
    "Company: " + company + "%0D%0A" +
    "Details: " + details;

  window.location.href = 
    "mailto:virtualonlinenz@gmail.com?subject=" + subject + "&body=" + body;
}
</script>
