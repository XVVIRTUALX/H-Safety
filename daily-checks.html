<!-- daily-checks.html -->
<div class="container">
  <h1>Daily Checks</h1>
  <h2 id="industry-name">Loading Industry...</h2>
  <h3 id="project-name">Loading Project...</h3>

  <!-- Daily Checks for the specific Industry -->
  <div id="daily-checks-list"></div>

  <button class="btn" id="saveBtn">Save Daily Check</button>
</div>

<script>
  // Retrieve industry and project from localStorage
  const industry = localStorage.getItem('selectedIndustry');
  const project = localStorage.getItem('projectName');

  // Display the industry and project name
  document.getElementById("industry-name").innerText = industry.charAt(0).toUpperCase() + industry.slice(1) + " Daily Checks";
  document.getElementById("project-name").innerText = "Project: " + project;

  // Fetch and display the daily checks for the selected industry
  const industryChecks = {
    aquaculture: ["PPE compliance verified", "Emergency exits unobstructed", "Equipment inspected"],
    waterquality: ["Water sample tests completed", "pH levels within range", "Chemical contamination tests"],
    climate: ["Energy consumption monitored", "Sustainability goals tracked", "Carbon emissions recorded"]
  };

  function displayDailyChecks(industry) {
    const checksContainer = document.getElementById('daily-checks-list');
    const checks = industryChecks[industry];

    if (!checks) {
      checksContainer.innerHTML = "<p>No checks available for this industry.</p>";
      return;
    }

    checks.forEach(check => {
      const checkLabel = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkLabel.appendChild(checkbox);
      checkLabel.appendChild(document.createTextNode(check));

      const textArea = document.createElement('textarea');
      textArea.className = 'report-textarea';
      textArea.placeholder = "Enter any relevant notes for this check...";

      checksContainer.appendChild(checkLabel);
      checksContainer.appendChild(textArea);
    });
  }

  // Call the function to display the daily checks
  displayDailyChecks(industry);
</script>
