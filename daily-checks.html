<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PutaiaoTech H&S – Daily Checks</title>

<style>
  body {
    background-color: #0D3B66;
    color: #FFD700;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 900px;
    margin: 50px auto;
    padding: 30px;
    background-color: #104E8B;
    border: 2px solid #FFD700;
    border-radius: 12px;
  }

  h1, h2 {
    text-align: center;
    color: #FFD700;
  }

  #daily-checks-list label {
    display: block;
    background-color: #0D3B66;
    padding: 12px 10px;
    margin-top: 10px;
    border: 1px solid #FFD700;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }

  input[type="checkbox"] {
    margin-right: 10px;
  }

  .report-textarea {
    width: 100%;
    height: 100px;
    margin-top: 5px;
    padding: 8px;
    background-color: #0D3B66;
    color: #FFD700;
    border: 1px solid #FFD700;
    border-radius: 8px;
  }

  .btn {
    background-color: #FFD700;
    color: #0D3B66;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    display: block;
    width: 100%;
    text-align: center;
  }

  .btn:hover {
    background-color: #fff200;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Daily Checks</h1>
  <h2 id="industry-name">Loading Industry...</h2>

  <div id="daily-checks-list"></div>

  <button class="btn" id="saveBtn">Save Daily Check</button>
</div>

<script>
  // Get industry from localStorage (preferred) or fallback to URL
  let industry = localStorage.getItem('selectedIndustry');
  if (!industry) {
    const params = new URLSearchParams(window.location.search);
    industry = params.get('industry');
  }

  if (!industry) industry = "General";

  document.getElementById("industry-name").innerText =
    industry.charAt(0).toUpperCase() + industry.slice(1) + " Daily Checks";

  // Daily checks per industry
  const industryChecks = {
    aquaculture: [
      "PPE compliance verified",
      "Emergency exits unobstructed",
      "Equipment inspected and functional",
      "Hazardous substances stored safely",
      "Staff trained on emergency procedures",
      "Incident reporting procedures followed",
      "Corrective actions recorded"
    ],
    waterquality: [
      "Water sample tests completed",
      "pH levels within range",
      "Microbial contamination checks",
      "Chemical contamination tests",
      "Emergency spill kits ready",
      "Water systems inspected",
      "Disposal procedures followed"
    ],
    climate: [
      "Energy consumption monitored",
      "Sustainability goals updated",
      "Carbon emissions recorded",
      "Environmental compliance confirmed",
      "Emergency procedures reviewed",
      "Staff informed of hazards",
      "Training on sustainability completed"
    ],
    General: [
      "PPE compliance verified",
      "Emergency exits unobstructed",
      "Work area clean and tidy",
      "Tools inspected and safe",
      "Breaks taken as scheduled",
      "Incidents reported"
    ]
  };

  function displayDailyChecks(industry) {
    const checksContainer = document.getElementById('daily-checks-list');
    const checks = industryChecks[industry] || industryChecks["General"];

    checks.forEach((check, index) => {
      const wrapper = document.createElement('div');

      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.id = "chk_" + index;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(check));

      const notes = document.createElement('textarea');
      notes.className = "report-textarea";
      notes.id = "notes_" + index;
      notes.placeholder = "Enter any notes for this check...";

      wrapper.appendChild(label);
      wrapper.appendChild(notes);
      checksContainer.appendChild(wrapper);
    });
  }

  displayDailyChecks(industry);

  // Save Functionality
  document.getElementById('saveBtn').addEventListener('click', function () {
    const data = [];
    const checksContainer = document.getElementById('daily-checks-list');
    const items = checksContainer.querySelectorAll("label");

    items.forEach((label, i) => {
      const checkbox = label.querySelector("input");
      const notes = document.getElementById("notes_" + i).value;
      data.push({
        check: label.textContent.trim(),
        completed: checkbox.checked,
        notes: notes
      });
    });

    const record = {
      industry: industry,
      date: new Date().toLocaleString(),
      results: data
    };

    let saved = JSON.parse(localStorage.getItem('dailyChecks')) || [];
    saved.push(record);
    localStorage.setItem('dailyChecks', JSON.stringify(saved));

    alert("Daily Checks Saved Successfully!");
    window.location.href = "dashboard.html"; // optional redirect
  });
</script>

</body>
</html>
