<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PutaiaoTech Industry Access</title>

<style>
body{
background:#0D3B66;
color:#FFD700;
font-family:Arial;
}

.container{
max-width:700px;
margin:60px auto;
padding:30px;
background:#104E8B;
border:2px solid #FFD700;
border-radius:10px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
background:#0D3B66;
color:#FFD700;
border:1px solid #FFD700;
border-radius:6px;
}

button{
background:#FFD700;
color:#0D3B66;
padding:10px 20px;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}
</style>
</head>
<script>

const validCodes = {
aquaculture:"PT-AQUA-2026",
construction:"PT-CONST-2026",
farming:"PT-FARM-2026",
distribution:"PT-DIST-2026",
office:"PT-OFFICE-2026",
laboratory:"PT-LAB-2026"
};

function activate(){

let industry=document.getElementById("industry").value;
let code=document.getElementById("code").value;

if(code===validCodes[industry]){

localStorage.setItem("industry_"+industry,"active");

alert("Industry Activated!");

}else{

alert("Invalid Activation Code");

}

}

</script>
<body>

<div class="container">

<h1>PutaiaoTech Industry Access</h1>

<p>Select an industry to unlock after payment.</p>

<select id="industry">
<option value="aquaculture">Aquaculture</option>
<option value="construction">Construction</option>
<option value="farming">Farming</option>
<option value="distribution">Distribution</option>
<option value="office">Office</option>
<option value="laboratory">Laboratory</option>
</select>

<p>Enter Activation Code</p>

<input type="text" id="code" placeholder="Enter activation code">

<button onclick="activate()">Activate Industry</button>

</div>
