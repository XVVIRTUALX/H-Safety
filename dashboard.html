<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PutaiaoTech H&S Dashboard</title>
<style>
body{background-color:#0D3B66;color:#FFD700;font-family:Arial,sans-serif;margin:0;padding:0;}
.container{max-width:900px;margin:50px auto;padding:30px;background-color:#104E8B;border:2px solid #FFD700;border-radius:12px;}
h1{text-align:center;color:#FFD700;}
.grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin-top:30px;}
.module{background-color:#FFD700;color:#0D3B66;padding:25px;border-radius:8px;text-align:center;font-weight:bold;cursor:pointer;font-size:1.2em;flex:1 1 40%;min-width:200px;transition:0.3s;}
.module:hover{background-color:#fff200;}
.feedback-btn{background-color:#FFD700;color:#0D3B66;font-weight:bold;padding:12px 20px;border-radius:8px;cursor:pointer;text-align:center;font-size:1.2em;margin-top:20px;display:block;width:100%;}
</style>
</head>
<body>
<div class="container">
<h1>PutaiaoTech Health & Safety Dashboard</h1>
<p style="text-align:center;background-color:#FFD700;color:#0D3B66;padding:10px;font-weight:bold;">
DEMO MODE – Sample data only. No information will be saved.
</p>

<div class="grid">
<div class="module" onclick="location.href='projects.html'">PROJECTS</div>
<div class="module" onclick="location.href='daily-checks.html'">DAILY CHECKS</div>
<div class="module" onclick="location.href='incidents.html'">INCIDENTS</div>
<div class="module" onclick="location.href='audits.html'">AUDITS</div>
<div class="module" onclick="location.href='contacts.html'">CONTACTS</div>
<div class="module" onclick="location.href='emergency.html'">EMERGENCY</div>
</div>

<button class="feedback-btn" onclick="openFeedbackForm()">Provide Feedback</button>
<button class="feedback-btn" onclick="endDemo()">End Demo & Return to Homepage</button>

<div id="feedbackForm" style="display:none;margin-top:20px;">
<h2 style="text-align:center;">Your Feedback</h2>
<textarea id="feedbackText" placeholder="Share your thoughts..." rows="6" style="width:100%;border-radius:6px;padding:10px;"></textarea>
<br><br>
<button class="feedback-btn" onclick="submitFeedback()">Submit Feedback</button>
</div>
</div>

<script>
function openFeedbackForm(){document.getElementById("feedbackForm").style.display="block";}
function submitFeedback(){
  const feedback=document.getElementById("feedbackText").value;
  if(feedback){localStorage.setItem('userFeedback',feedback);alert('Thank you for your feedback!');document.getElementById("feedbackForm").style.display="none";}
  else{alert('Please enter some feedback before submitting.');}
}
function endDemo(){window.location.href="index.html";}
</script>
</body>
</html>
