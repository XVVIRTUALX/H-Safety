<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PutaiaoTech H&S - Training</title>
<style>
  body {
    background-color:#4A90E2;
    color:#FFFFFF;
    font-family: Arial, sans-serif;
    margin:0;
    padding:0;
  }
  header {
    background-color:#FFEB3B;
    color:#1A237E;
    padding:1rem;
    text-align:center;
    font-size:1.5rem;
  }
  main {
    padding:2rem;
    max-width:800px;
    margin:auto;
  }
  table {
    width:100%;
    border-collapse: collapse;
    margin-top:20px;
  }
  th, td {
    border:1px solid #fff;
    padding:8px;
    text-align:left;
  }
  input, button {
    padding:8px;
    margin:5px 0;
    border-radius:5px;
    border:none;
  }
  button {
    background-color:#FFD700;
    color:#0D3B66;
    font-weight:bold;
    cursor:pointer;
  }
  button:hover {
    background-color:#fff200;
  }
</style>
</head>
<body>

<header>Health & Safety Training</header>

<main>
  <h2>Add Training Record</h2>
  <label for="trainingName">Training Name / Description:</label>
  <input type="text" id="trainingName" placeholder="e.g., Fire Safety Induction">
  <label for="trainingDate">Training Date:</label>
  <input type="date" id="trainingDate">
  <button id="addTrainingBtn">Add Training</button>

  <h2>Training Records</h2>
  <table id="trainingTable">
    <tr>
      <th>Training Name</th>
      <th>Date</th>
    </tr>
  </table>

  <button id="downloadCSV">Download Training Records</button>
</main>

<script>
  // Load from localStorage
  const trainingTable = document.getElementById('trainingTable');
  let trainingRecords = JSON.parse(localStorage.getItem('trainingRecords') || "[]");

  function renderTable() {
    // Clear all rows except header
    trainingTable.innerHTML = '<tr><th>Training Name</th><th>Date</th></tr>';
    trainingRecords.forEach(record => {
      const row = trainingTable.insertRow();
      row.insertCell(0).innerText = record.name;
      row.insertCell(1).innerText = record.date;
    });
  }

  renderTable();

  // Add new training
  document.getElementById('addTrainingBtn').addEventListener('click', () => {
    const name = document.getElementById('trainingName').value.trim();
    const date = document.getElementById('trainingDate').value;
    if (!name || !date) {
      alert('Both fields are required');
      return;
    }
    trainingRecords.push({ name, date });
    localStorage.setItem('trainingRecords', JSON.stringify(trainingRecords));
    renderTable();
    document.getElementById('trainingName').value = '';
    document.getElementById('trainingDate').value = '';
  });

  // Download CSV
  document.getElementById('downloadCSV').addEventListener('click', () => {
    const csv = trainingRecords.map(r => `"${r.name}","${r.date}"`).join("\n");
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'training_records.csv';
    link.click();
  });
</script>

</body>
</html>
