<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PutaiaoTech H&S – Projects</title>
<style>
body { background-color:#0D3B66; color:#FFD700; font-family: Arial, sans-serif; margin:0; padding:0; }
.container { max-width:900px; margin:50px auto; padding:30px; background-color:#104E8B; border:2px solid #FFD700; border-radius:12px; }
h1,h2{text-align:center;}
select,input{width:100%; padding:10px; margin-top:10px; border-radius:6px; border:none; font-size:1em;}
.btn{background-color:#FFD700;color:#0D3B66;padding:12px 20px;margin-top:10px;border-radius:8px;font-weight:bold;cursor:pointer;display:inline-block;width:48%;text-align:center;margin-right:4%;}
.btn:hover{background-color:#fff200;}
</style>
</head>
<body>

<div class="container">
  <h1>PutaiaoTech Health & Safety</h1>
  <h2>Create Project</h2>

  <label>Select Industry:</label>
  <select id="industrySelect">
    <option value="aquaculture">Aquaculture</option>
    <option value="waterquality">Water Quality</option>
    <option value="climate">Climate</option>
    <option value="farming">Farming</option>
    <option value="manufacturing">Manufacturing</option>
    <option value="construction">Construction</option>
    <option value="distribution">Distribution</option>
    <option value="office">Office</option>
    <option value="laboratory">Laboratory</option>
  </select>

  <label>Project Name:</label>
  <input type="text" id="projectName" placeholder="Enter project name" required>

  <div style="display:flex; justify-content:space-between;">
    <button id="saveProjectBtn" class="btn">Save Project & Go to Payment</button>
    <button id="demoBtn" class="btn">Bypass Demo → Dashboard</button>
  </div>
</div>

<script>
document.getElementById('saveProjectBtn').addEventListener('click', function () {
    const industry = document.getElementById('industrySelect').value;
    const projectName = document.getElementById('projectName').value;
    if(!projectName){ alert("Please enter a project name."); return; }
    localStorage.setItem("HS_SelectedIndustry", industry);
    localStorage.setItem("HS_ProjectName", projectName);
    window.location.href = "payment.html";
});
document.getElementById('demoBtn').addEventListener('click', function () {
    const industry = document.getElementById('industrySelect').value;
    const projectName = document.getElementById('projectName').value;
    if(!projectName){ alert("Please enter a project name."); return; }
    localStorage.setItem("HS_SelectedIndustry", industry);
    localStorage.setItem("HS_ProjectName", projectName);
    window.location.href = "dashboard.html";
});
</script>
</body>
</html>
