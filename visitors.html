<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PutaiaoTech H&S - Visitors Log</title>
<style>
  body {
    background-color:#0D3B66;
    color:#FFD700;
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
  }
  h1 {
    text-align:center;
    margin-bottom:20px;
  }
  form {
    max-width:600px;
    margin:auto;
    background:#104E8B;
    padding:20px;
    border:2px solid #FFD700;
    border-radius:12px;
  }
  label {
    display:block;
    margin:10px 0 5px;
  }
  input, button {
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:5px;
    border:none;
  }
  button {
    background-color:#FFD700;
    color:#0D3B66;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
  }
  button:hover { background-color:#fff200; }
  table {
    width:90%;
    margin:20px auto;
    border-collapse:collapse;
  }
  th, td {
    border:1px solid #FFD700;
    padding:8px;
    text-align:center;
  }
  th {
    background:#FFD700;
    color:#0D3B66;
  }
</style>
</head>
<body>

<h1>PutaiaoTech H&S - Visitors Log</h1>

<form id="visitorForm">
  <label>Name</label>
  <input type="text" id="visitorName" required>

  <label>Date Arrived</label>
  <input type="date" id="visitorDate" required>

  <label>Time In</label>
  <input type="time" id="timeIn" required>

  <label>Time Out</label>
  <input type="time" id="timeOut" required>

  <label>Meeting With</label>
  <input type="text" id="meetingWith" required>

  <button type="submit">Add Visitor</button>
</form>

<table id="visitorTable">
  <thead>
    <tr>
      <th>Name</th>
      <th>Date</th>
      <th>Time In</th>
      <th>Time Out</th>
      <th>Meeting With</th>
    </tr>
  </thead>
  <tbody>
    <!-- Visitor entries appear here -->
  </tbody>
</table>
